<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Para Yesmin ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    /* Pantalla de Inicio */
    #welcome-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: radial-gradient(circle, #1a0826 0%, #000000 100%); z-index: 100;
      color: white; text-align: center; transition: opacity 2.5s ease, visibility 2.5s;
    }
    .card {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 28px;
      padding: 40px 30px; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8); width: 85%; max-width: 360px;
    }
    .card h1 { font-size: 3rem; margin-bottom: 10px; color: #ffffff; letter-spacing: 2px; text-shadow: 0 0 15px #ff69b4; }
    .card p { font-size: 0.8rem; color: #e0b0ff; letter-spacing: 3px; margin-bottom: 30px; font-weight: bold; }

    .sticker {
      width: 100px; height: 100px; margin-bottom: 25px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    #start-btn {
      padding: 16px 50px; font-size: 1.1rem; border: none; border-radius: 35px;
      background: linear-gradient(135deg, #8a2be2, #ff1493); color: white; font-weight: bold;
      cursor: pointer; box-shadow: 0 5px 25px rgba(255, 20, 147, 0.6);
      letter-spacing: 2px; transition: all 0.3s ease; outline: none;
    }
    #start-btn:active { transform: scale(0.92); }

    /* Canvas 3D */
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  </style>

  <!-- Librerías Three.js y Tween.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

  <!-- Elemento de Audio -->
  <audio id="bg-music" src="Cancion.mp3" preload="auto"></audio>

  <!-- Pantalla de Bienvenida -->
  <div id="welcome-screen">
    <div class="card">
      <h1>Yesmin.</h1>
      
      <svg class="sticker" viewBox="0 0 100 100">
        <circle cx="35" cy="55" r="22" fill="#ffffff" />
        <circle cx="22" cy="38" r="8" fill="#ffffff" />
        <circle cx="65" cy="55" r="22" fill="#8B5A2B" />
        <circle cx="78" cy="38" r="8" fill="#8B5A2B" />
        <circle cx="30" cy="50" r="3" fill="#000" />
        <circle cx="42" cy="50" r="3" fill="#000" />
        <circle cx="58" cy="50" r="3" fill="#000" />
        <circle cx="70" cy="50" r="3" fill="#000" />
        <path d="M 50 32 C 40 18, 25 32, 50 52 C 75 32, 60 18, 50 32 Z" fill="#ff2e63" />
      </svg>

      <p>HAZ CLIC PARA INICIAR</p>
      <button id="start-btn">INICIAR</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, controls;
    let galaxyParticles, heartParticles, saturnRingMesh, starsParticles, blackHoleMesh;
    let textGroup = new THREE.Group();
    let textSprites = [];
    let loadedImages = [];

    // Incluimos las 7 imágenes enviadas
    const imageSources = ['Foto1.png', 'Foto2.png', 'Foto3.png', 'Foto4.png', 'Foto5.png', 'Foto6.png', 'Foto8.png'];

    const basePhrases = [
      "AMOR ETERNO ❤️", "INFINITO ∞", "CONTIGO SIEMPRE", "MI CORAZÓN ES TUYO",
      "TE AMO YESMIN 💕", "MI UNIVERSO 🌌", "ERES MI VIDA", "TÚ Y YO POR SIEMPRE",
      "MI PERSONA FAVORITA", "NUESTRO AMOR ES MÁGICO", "SIEMPRE EN MI MENTE",
      "MI SUEÑO HECHO REALIDAD ✨", "ERES PERFECTA", "AMOR DE MI VIDA",
      "MI LUZ 🌟", "JUNTOS POR SIEMPRE", "MI DESTINO 💖", "AMOR SIN FIN"
    ];

    const phrases = [...basePhrases, ...basePhrases, ...basePhrases];

    function preloadImages(callback) {
      let loadedCount = 0;
      imageSources.forEach((src, idx) => {
        const img = new Image();
        img.src = src;
        img.onload = () => {
          loadedImages[idx] = img;
          loadedCount++;
          if (loadedCount === imageSources.length) callback();
        };
        img.onerror = () => {
          console.warn(`No se pudo cargar la imagen: ${src}`);
          loadedCount++;
          if (loadedCount === imageSources.length) callback();
        };
      });
    }

    function playAudioAtChorus() {
      const audio = document.getElementById('bg-music');
      if (audio) {
        audio.currentTime = 34.8;
        audio.volume = 0;
        audio.play().then(() => {
          let vol = 0;
          const fadeInterval = setInterval(() => {
            if (vol < 0.9) {
              vol += 0.05;
              audio.volume = vol;
            } else {
              audio.volume = 1.0;
              clearInterval(fadeInterval);
            }
          }, 75);
        }).catch(err => console.log("Autoplay bloqueado:", err));
      }
    }

    function init() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.001);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(0, 300, 950);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 900;
      controls.minDistance = 20;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5;
      controls.enabled = false;

      createBackgroundStars();
      createCentralBlackHole();
      createSaturnRing();
      createGalaxy();
      create3DHeart();
      createMassiveOrbitingTextsAndImages();

      scene.add(textGroup);

      window.addEventListener('resize', onWindowResize);
      document.getElementById('start-btn').addEventListener('click', startExperience);
    }

    function createBackgroundStars() {
      const starCount = 7000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 1800;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 1800;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 1800;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 1.2,
        transparent: true,
        opacity: 0
      });

      starsParticles = new THREE.Points(geometry, material);
      scene.add(starsParticles);
    }

    function createCentralBlackHole() {
      const bhGeo = new THREE.SphereGeometry(15, 64, 64);
      const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0 });
      blackHoleMesh = new THREE.Mesh(bhGeo, bhMat);
      scene.add(blackHoleMesh);
    }

    function createSaturnRing() {
      const particleCount = 25000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const colorInner = new THREE.Color(0xffd700);
      const colorOuter = new THREE.Color(0xff0055);

      for (let i = 0; i < particleCount; i++) {
        const radius = Math.random() * 35 + 20;
        const angle = Math.random() * Math.PI * 2;

        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        const y = (Math.random() - 0.5) * 1.2;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const mixedColor = colorInner.clone().lerp(colorOuter, (radius - 20) / 35);
        colors[i * 3] = mixedColor.r;
        colors[i * 3 + 1] = mixedColor.g;
        colors[i * 3 + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 1.4,
        vertexColors: true,
        transparent: true,
        opacity: 0
      });

      saturnRingMesh = new THREE.Points(geometry, material);
      scene.add(saturnRingMesh);
    }

    function createGalaxy() {
      const particleCount = 40000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const colorInside = new THREE.Color(0xff007f);
      const colorOutside = new THREE.Color(0x7b00ff);

      for (let i = 0; i < particleCount; i++) {
        const r = Math.random() * 260 + 25;
        const spinAngle = r * 0.06;
        const branchAngle = ((i % 5) * Math.PI * 2) / 5;

        const randomX = (Math.random() - 0.5) * 10;
        const randomY = (Math.random() - 0.5) * 10;
        const randomZ = (Math.random() - 0.5) * 10;

        const x = Math.cos(branchAngle + spinAngle) * r + randomX;
        const z = Math.sin(branchAngle + spinAngle) * r + randomZ;
        const y = (Math.random() - 0.5) * (180 / r) + randomY;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        const mixedColor = colorInside.clone().lerp(colorOutside, r / 260);
        colors[i * 3] = mixedColor.r;
        colors[i * 3 + 1] = mixedColor.g;
        colors[i * 3 + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 1.2,
        vertexColors: true,
        transparent: true,
        opacity: 0
      });

      galaxyParticles = new THREE.Points(geometry, material);
      scene.add(galaxyParticles);
    }

    function create3DHeart() {
      const heartCount = 10000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(heartCount * 3);

      for (let i = 0; i < heartCount; i++) {
        const phi = Math.random() * Math.PI * 2;
        const theta = Math.random() * Math.PI;

        let x = 16 * Math.pow(Math.sin(theta), 3) * Math.cos(phi);
        let z = 16 * Math.pow(Math.sin(theta), 3) * Math.sin(phi);
        let y = 13 * Math.cos(theta) - 5 * Math.cos(2*theta) - 2 * Math.cos(3*theta) - Math.cos(4*theta);

        const scale = 2.4;
        positions[i * 3] = (x + (Math.random() - 0.5) * 1.5) * scale;
        positions[i * 3 + 1] = (y + (Math.random() - 0.5) * 1.5) * scale + 95;
        positions[i * 3 + 2] = (z + (Math.random() - 0.5) * 1.5) * scale;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({
        color: 0xff1493,
        size: 1.8,
        transparent: true,
        opacity: 0
      });

      heartParticles = new THREE.Points(geometry, material);
      scene.add(heartParticles);
    }

    function createMassiveOrbitingTextsAndImages() {
      phrases.forEach((phrase, i) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 400; 
        canvas.height = 180;

        const img = loadedImages[i % loadedImages.length];

        if (img) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(200, 45, 38, 0, Math.PI * 2, true);
          ctx.closePath();
          ctx.clip();

          ctx.drawImage(img, 162, 7, 76, 76);

          ctx.restore();

          ctx.beginPath();
          ctx.arc(200, 45, 38, 0, Math.PI * 2, true);
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#ff69b4';
          ctx.shadowColor = '#ff1493';
          ctx.shadowBlur = 10;
          ctx.stroke();
        }

        ctx.font = 'Bold 22px Arial';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ff69b4';
        ctx.shadowBlur = 12;
        ctx.textAlign = 'center';
        ctx.fillText(phrase, 200, 135);

        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0 });
        const sprite = new THREE.Sprite(spriteMaterial);

        const angle = (i / phrases.length) * Math.PI * 2;
        const radius = 60 + (i % 6) * 25; 
        sprite.position.x = Math.cos(angle) * radius;
        sprite.position.z = Math.sin(angle) * radius;
        sprite.position.y = ((i % 7) - 3) * 18 + 10;
        sprite.scale.set(40, 18, 1);

        textSprites.push(sprite);
        textGroup.add(sprite);
      });
    }

    function startExperience() {
      playAudioAtChorus();

      const screen = document.getElementById('welcome-screen');
      screen.style.opacity = '0';
      setTimeout(() => { screen.style.display = 'none'; }, 2000);

      new TWEEN.Tween(camera.position)
        .to({ x: 0, y: 40, z: 220 }, 10000)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onUpdate(() => { camera.lookAt(0, 30, 0); })
        .onComplete(() => {
          controls.enabled = true;
          controls.target.set(0, 30, 0);
        })
        .start();

      new TWEEN.Tween(starsParticles.material).to({ opacity: 0.8 }, 2000).delay(500).start();
      new TWEEN.Tween(blackHoleMesh.material).to({ opacity: 1 }, 1500).delay(2000).start();
      new TWEEN.Tween(saturnRingMesh.material).to({ opacity: 0.95 }, 2500).delay(2500).start();
      new TWEEN.Tween(galaxyParticles.material).to({ opacity: 0.8 }, 3000).delay(4000).start();

      textSprites.forEach((sprite, index) => {
        new TWEEN.Tween(sprite.material)
          .to({ opacity: 1 }, 1000)
          .delay(5000 + (index * 60))
          .start();
      });

      new TWEEN.Tween(heartParticles.material).to({ opacity: 0.95 }, 2500).delay(7500).start();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      TWEEN.update();

      const elapsedTime = clock.getElapsedTime();

      if (saturnRingMesh) saturnRingMesh.rotation.y += 0.012;
      if (galaxyParticles) galaxyParticles.rotation.y += 0.001;
      if (starsParticles) starsParticles.rotation.y += 0.0002;
      if (textGroup) textGroup.rotation.y += 0.0035;

      if (heartParticles) {
        heartParticles.rotation.y += 0.002;
        const beat = 1 + Math.sin(elapsedTime * 4) * 0.06;
        heartParticles.scale.set(beat, beat, beat);
      }

      if (controls && controls.enabled) {
        controls.update();
      }

      renderer.render(scene, camera);
    }

    preloadImages(() => {
      init();
      animate();
    });
  </script>
</body>
</html>
